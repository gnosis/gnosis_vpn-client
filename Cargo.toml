[workspace]
members  = ["gnosis_vpn*"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "LGPL-3.0-only"
version = "0.93.1"

[workspace.metadata.crane]
name = "gnosis_vpn"

[workspace.dependencies]
anyhow = { version = "~1.0.104" }
async-trait = "~0.1.91"
backon = { version = "~1.6.0" }
bytesize = "~2.7.0"
cfg-if = "~1.0.4"
chrono = { version = "~0.4.45", default-features = false, features = [
  "clock",
  "serde",
  "std",
] }
clap = { version = "~4.6.3", features = ["derive", "env"] }
clap_complete = "~4.6.7"
edgli = { git = "https://github.com/hoprnet/edge-client.git", rev = "31e07ad4060e8a6309bb8913027160a2b427dede", features = [
  "blokli",
  "telemetry",
] }
exitcode = "~1.1.2"
futures = "~0.3.33"
futures-util = "~0.3.33"
hopr-utils-session = { git = "https://github.com/hoprnet/hoprnet", rev = "4bb7cea5ecd7a970d64dd1a900357e62a74f0dd4", features = [
  "runtime-tokio",
] }
human-bandwidth = "~0.1.4"
humantime = "~2.4.0"
humantime-serde = "~1.1.1"
ipnetwork = "~0.21.1"
libc = "~0.2.188"
mnl = "~0.3.1"
multiaddr = "~0.18.2"
nftnl = "~0.9.2"
notify = "~8.2.0"
pfctl = "~0.7.0"
ping = { version = "~0.9.0", features = ["tokio"] }
rand = "~0.10.2"
reqwest = { version = "~0.13.4", features = ["blocking", "json"] }
rtnetlink = "~0.21.0"
serde = { version = "~1.0.229", features = ["derive"] }
serde-saphyr = "~0.0.29"
serde_json = "~1.0.151"
serde_with = "~3.21.0"
tempfile = "~3.27.0"
thiserror = "~2.0.19"
tikv-jemallocator = "~0.7.0"
tokio = { version = "~1.53.1", features = ["full"] }
tokio-util = { version = "~0.7.19", features = ["rt"] }
toml = "~1.1.3"
tracing = { version = "~0.1.44", features = ["release_max_level_debug"] }
tracing-subscriber = "~0.3.23"
url = { version = "~2.5.8", features = ["serde"] }
uzers = "~0.12.2"

objc2 = "~0.6.4"
objc2-foundation = { version = "~0.3.2", features = [
  "NSProcessInfo",
  "NSString",
] }

gnosis_vpn-lib = { path = "gnosis_vpn-lib" }

# this profile focuses on the best runtime performance and the smallest binary size
[profile.release]
codegen-units = 1
lto           = "fat"
opt-level     = 3
panic         = "abort"
strip         = true
