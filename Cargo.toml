[workspace]
members  = ["gnosis_vpn*"]
resolver = "2"

[workspace.package]
edition      = "2024"
license      = "LGPL-3.0-only"
rust-version = "1.94"
version      = "0.101.0"

[workspace.metadata.crane]
name = "gnosis_vpn"

[workspace.dependencies]
anyhow = { version = "~1.0.104" }
async-trait = "~0.1.92"
backon = { version = "~1.6.0" }
base64 = "~0.23.1"
bytesize = "~2.7.0"
cfg-if = "~1.0.4"
chrono = { version = "~0.4.45", default-features = false, features = [
  "clock",
  "serde",
  "std",
] }
clap = { version = "~4.6.6", features = ["derive", "env"] }
clap_complete = "~4.6.9"
edgli = { git = "https://github.com/hoprnet/edge-client.git", rev = "394bb6d6612c9915ef1f06b2012e984b8dc31e3a", features = [
  "blokli",
  "pix",
  "pix-test",
  "telemetry",
] }
exitcode = "~1.1.2"
futures = "~0.3.34"
futures-util = "~0.3.34"
# Tracks `master` to match `edgli`'s own `hopr-lib` pin. Cargo keys a git source on the reference,
# not the resolved commit, so `branch = "master"` here and `rev = "<sha>"` there are two sources even
# at the same commit -- hoprnet gets built twice and the types do not unify. `Cargo.lock` holds the
# actual commit; keep it at whatever every node this client talks to was built from.
hopr-utils-session = { git = "https://github.com/hoprnet/hoprnet", branch = "master", features = [
  "runtime-tokio",
] }
human-bandwidth = "~0.1.4"
humantime = "~2.4.0"
humantime-serde = "~1.1.1"
ipnetwork = "~0.21.1"
libc = "~0.2.189"
mnl = "~0.3.1"
neptun = { git = "https://github.com/NordSecurity/neptun.git", tag = "v3.0.2" }
nftnl = "~0.9.4"
notify = "~8.2.0"
pfctl = "~0.7.0"
ping = { version = "~0.9.0", features = ["tokio"] }
rand = "~0.10.2"
reqwest = { version = "~0.13.4", features = ["blocking", "json"] }
rtnetlink = "~0.23.0"
rustix = { version = "~1.1.4", features = ["fs", "net", "pipe", "stdio"] }
serde = { version = "~1.0.229", features = ["derive"] }
serde-saphyr = "~0.0.29"
serde_json = "~1.0.151"
serde_with = "~3.22.0"
tempfile = "~3.27.0"
thiserror = "~2.0.20"
tikv-jemallocator = "~0.7.0"
tokio = { version = "~1.53.1", features = ["full"] }
tokio-util = { version = "~0.7.19", features = ["rt"] }
toml = "~1.1.4"
tracing = { version = "~0.1.44", features = ["release_max_level_debug"] }
tracing-subscriber = "~0.3.23"
url = { version = "~2.5.8", features = ["serde"] }
uzers = "~0.12.2"
x25519-dalek = { version = "~2.0.1", features = [
  "getrandom",
  "static_secrets",
] }

objc2 = "~0.6.4"
objc2-foundation = { version = "~0.3.2", features = [
  "NSProcessInfo",
  "NSString",
] }

gnosis_vpn-lib = { path = "gnosis_vpn-lib" }

# this profile focuses on the best runtime performance and the smallest binary size
[profile.release]
codegen-units = 1
lto           = "fat"
opt-level     = 3
panic         = "abort"
strip         = true
