[workspace]
members  = ["gnosis_vpn*"]
resolver = "2"

[workspace.package]
edition      = "2024"
license      = "LGPL-3.0-only"
rust-version = "1.94"
version      = "0.102.0"

[workspace.metadata.crane]
name = "gnosis_vpn"

[workspace.dependencies]
anyhow = { version = "~1.0.104" }
async-trait = "~0.1.92"
backon = { version = "~1.6.0" }
base64 = "~0.23.1"
bytesize = "~2.7.0"
cfg-if = "~1.0.5"
clap = { version = "~4.6.7", features = ["derive", "env"] }
clap_complete = "~4.6.11"
edgli = { git = "https://github.com/hoprnet/edge-client.git", rev = "b6614471abb975959060e86df1b0c28ce8305d07", default-features = false, features = [
  # No PIX deposit pool here: edgli's `pix-test` and `pix-curvy` are mutually exclusive, and a
  # feature listed on a workspace dependency cannot be switched off by a member. Every crate
  # forwards one, `pix-curvy` by default; see the `pix-test` build in nix/gnosisvpn.nix.
  "blokli",
  "pix",
  "runtime-tokio",
  "telemetry",
] }
exitcode = "~1.1.2"
futures = "~0.3.34"
futures-util = "~0.3.34"
# Pinned by BRANCH to match edgli's own `hopr-lib` pin: cargo treats `?branch=X#sha` and
# `?rev=sha` as distinct sources, so mixing them vendors hoprnet twice and fails to compile.
hopr-utils-session = { git = "https://github.com/hoprnet/hoprnet", branch = "master", features = [
  "runtime-tokio",
] }
human-bandwidth = "~0.1.4"
humantime = "~2.4.0"
humantime-serde = "~1.1.1"
ipnetwork = "~0.21.1"
libc = "~0.2.189"
maxminddb = "~0.32.0"
mnl = "~0.3.1"
neptun = { git = "https://github.com/NordSecurity/neptun.git", tag = "v3.0.5" }
nftnl = "~0.9.4"
notify = "~8.2.0"
pfctl = "~0.7.0"
ping = { version = "~0.10.0", features = ["tokio"] }
rand = "~0.10.3"
reqwest = { version = "~0.13.5", features = ["blocking", "json"] }
rtnetlink = "~0.23.0"
rustix = { version = "~1.1.5", features = ["fs", "net", "pipe", "stdio"] }
serde = { version = "~1.0.229", features = ["derive"] }
serde-saphyr = "~1.3.0"
serde_json = "~1.0.151"
serde_with = "~3.24.0"
tempfile = "~3.27.0"
thiserror = "~2.0.21"
tikv-jemallocator = "~0.7.0"
tokio = { version = "~1.53.1", features = ["full"] }
tokio-util = { version = "~0.7.19", features = ["rt"] }
toml = "~1.1.6"
tracing = { version = "~0.1.44", features = ["release_max_level_debug"] }
tracing-subscriber = "~0.3.23"
url = { version = "~2.5.8", features = ["serde"] }
uzers = "~0.12.2"

objc2 = "~0.6.4"
objc2-foundation = { version = "~0.3.2", features = [
  "NSProcessInfo",
  "NSString",
] }

gnosis_vpn-lib = { path = "gnosis_vpn-lib", default-features = false }

# this profile focuses on the best runtime performance and the smallest binary size
[profile.release]
codegen-units = 1
lto           = "fat"
opt-level     = 3
panic         = "abort"
strip         = true
