# piz-palu-dev system test client config; keep in sync with the gnosis_vpn installer's linux/resources/config-piz-palu-dev.toml

version = 7

[pix_strategy]
deposit_buffer_period     = "500ms"
initial_funding           = "0.0001 wxHOPR"               # matches the dev VM; must cover the ~0.0000031 wxHOPR commitment fee, the 100 wxHOPR default exceeds the test Safe
max_deposit_retries       = 3
max_deposit_tracking_time = "60s"
max_ssa_allocation        = "0.000000001 wxHOPR"
price_per_byte            = "0.000000000000000001 wxHOPR"
relayer_url               = "https://api.curvy.dev"

[connection.path_planner]
# Prune to the 3 fastest candidate paths; the client preset keeps every relayer (0).
min_paths_anonymity_floor = 3

[connection.pix.dimensions]
# Keeps the per-SSA quota within what the exits accept; the client default exceeds it.
additional_shares = 20
num_ssa_parts     = 4096
ssa_part_size     = 64
