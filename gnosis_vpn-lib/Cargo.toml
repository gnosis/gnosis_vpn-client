[package]
edition      = { workspace = true }
license      = { workspace = true }
name         = "gnosis_vpn-lib"
rust-version = { workspace = true }
version      = { workspace = true }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
async-trait.workspace        = true
backon.workspace             = true
base64.workspace             = true
bytesize                     = { workspace = true, features = ["serde"] }
cfg-if.workspace             = true
edgli.workspace              = true
futures-util.workspace       = true
hopr-utils-session.workspace = true
human-bandwidth              = { workspace = true, features = ["serde"] }
humantime.workspace          = true
humantime-serde.workspace    = true
ipnetwork.workspace          = true
maxminddb.workspace          = true
neptun.workspace             = true
ping.workspace               = true
rand.workspace               = true
reqwest.workspace            = true
serde.workspace              = true
serde-saphyr.workspace       = true
serde_json.workspace         = true
serde_with.workspace         = true
thiserror.workspace          = true
tokio.workspace              = true
tokio-util.workspace         = true
toml.workspace               = true
tracing.workspace            = true
tracing-appender.workspace   = true
tracing-subscriber.workspace = true
url.workspace                = true
uzers.workspace              = true

[target.'cfg(unix)'.dependencies]
libc   = { workspace = true }
rustix = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
mnl   = { workspace = true }
nftnl = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace            = true
objc2-foundation.workspace = true
pfctl.workspace            = true

[dev-dependencies]
anyhow.workspace   = true
insta              = "1.49.0"
tempfile.workspace = true
tokio              = { workspace = true, features = ["test-util"] }

[features]
default = ["pix-curvy"]
# The PIX deposit pool, forwarded to edgli; exactly one, they are mutually exclusive there.
# `pix-curvy` settles to anonymous Baby JubJub addresses through the Curvy pool and is what ships;
# `pix-test` settles to visible secp256k1 addresses, for testing against a `pix-test` Exit.
pix-curvy = ["edgli/pix-curvy"]
pix-test  = ["edgli/pix-test"]

[lib]
doctest = false

[[test]]
harness = false
name    = "worker_bootstrap"
path    = "tests/worker_bootstrap.rs"
