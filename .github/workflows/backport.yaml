name: Backport

on:
  pull_request_target:
    types:
      - closed
      - labeled

permissions:
  contents: read

jobs:
  backport:
    name: Backport merged PR
    runs-on: depot-ubuntu-22.04-4
    if: >
      github.event.pull_request.merged == true
      && (
        github.event.action == 'closed'
        || startsWith(github.event.label.name, 'backport ')
      )
    permissions:
      contents: read
    steps:
      # Default GITHUB_TOKEN PRs skip CI (loop-prevention); use the GH App bot instead.
      - name: Generate GitHub App token
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GH_APP_GNOSISVPN_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_GNOSISVPN_BOT_PRIVATE_KEY }}
          owner: gnosis
      - name: Backport
        uses: korthout/backport-action@2e830a1d0b8269505846ddd407a70876913ad1f8 # v4.6.0
        with:
          github_token: ${{ steps.bot-token.outputs.token }}
          # Labels look like "backport release/v4" -- the capture group names the target branch.
          label_pattern: ^backport ([^ ]+)$
