name: Close release
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Version type after release
        required: true
        type: choice
        default: "patch"
        options:
          - patch
          - minor
          - major
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build-binaries:
    name: Binary ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64-linux
            runner: depot-ubuntu-22.04-4 # Depot Ubuntu 22.04, 4 CPUs, 16 GB RAM
            build_command: nix build -L .#binary-gnosis_vpn-x86_64-linux
          - architecture: aarch64-linux
            runner: depot-ubuntu-22.04-arm-4 # Depot Ubuntu 22.04 ARM, 4 CPUs, 16 GB RAM
            build_command: nix build -L .#binary-gnosis_vpn-aarch64-linux
          - architecture: aarch64-darwin
            runner: ${{ vars.MACOS_RUNNER }} # Posible values are: `macos-26-xlarge` or `depot-macos-26`
            build_command: nix build -L .#binary-gnosis_vpn-aarch64-darwin
    uses: hoprnet/hopr-workflows/.github/workflows/build-binaries.yaml@f15435652c572ad5688af679f0e2b153c98c9773 # build-binaries-v4.0.2
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    with:
      repo_sha: ${{ github.sha }}
      version_type: release
      architecture: ${{ matrix.architecture }}
      cachix_cache_name: gnosis-vpn-client
      build_command: ${{ matrix.build_command }}
      binary: gnosis_vpn-client
      gcp_workload_identity_provider: projects/656686060169/locations/global/workloadIdentityPools/gnosisvpn-gh-pool/providers/github-provider
      gcp_service_account: download-gnosisvpn-gh-sa@gnosisvpn-production.iam.gserviceaccount.com
      runner: ${{ matrix.runner }}
      timeout_minutes: 240
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      gpg_private_key: ${{ secrets.GNOSISVPN_GPG_PRIVATE_KEY }}
      gpg_private_key_password: ${{ secrets.GNOSISVPN_GPG_PRIVATE_KEY_PASSWORD }}
      apple_certificate: ${{ secrets.APPLE_CERTIFICATE_DEVELOPER_P12_BASE64 }}
      apple_certificate_password: ${{ secrets.APPLE_CERTIFICATE_DEVELOPER_PASSWORD }}
  release:
    name: Close release
    needs:
      - build-binaries
    runs-on: depot-ubuntu-22.04-4
    permissions:
      contents: write
      id-token: write
    steps:
      # release-version reads the version from the branch tip, which may have moved since the build
      - name: Check the branch version matches the build
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          version_at() {
            gh api "repos/$REPO/contents/Cargo.toml?ref=$1" --jq .content | base64 -d | grep -m1 '^version'
          }
          built=$(version_at "$BUILD_SHA")
          released=$(version_at "$BRANCH")
          if [ "$built" != "$released" ]; then
            echo "::error::$BRANCH moved to $released since the build of $built at $BUILD_SHA"
            exit 1
          fi
      - name: Release version
        uses: hoprnet/hopr-workflows/actions/release-version@f15435652c572ad5688af679f0e2b153c98c9773 # release-version-v5.5.2
        with:
          source_branch: ${{ github.ref_name }}
          # Tag the commit build-binaries built, not a branch tip that may have moved since
          target_commitish: ${{ github.sha }}
          file: Cargo.toml
          release_type: ${{ inputs.release_type }}
          cachix_cache_name: gnosis-vpn-client
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          zulip_api_key: ${{ secrets.GNOSIS_VPN_ZULIP_API_KEY }}
          zulip_email: ${{ secrets.GNOSIS_VPN_ZULIP_EMAIL }}
          zulip_channel: Gnosis VPN
          zulip_topic: Releases
          gcp_workload_identity_provider: projects/656686060169/locations/global/workloadIdentityPools/gnosisvpn-gh-pool/providers/github-provider
          gcp_service_account: download-gnosisvpn-gh-sa@gnosisvpn-production.iam.gserviceaccount.com
          gcp_artifact_package: gnosis_vpn-client
          github_app_private_key: ${{ secrets.GH_APP_GNOSISVPN_BOT_PRIVATE_KEY }}
          github_app_client_id: ${{ secrets.GH_APP_GNOSISVPN_CLIENT_ID }}
