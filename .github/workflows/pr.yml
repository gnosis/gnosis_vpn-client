name: PR
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
concurrency:
  group: ${{ github.ref }}-pr
  cancel-in-progress: true
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  # Split out from the arm/darwin matrix below so system-test can depend on
  # just this leg via `needs:` and reuse its cachix-pushed binary instead of
  # recompiling root/worker/ctl itself.
  build-x86_64-linux:
    name: Binary x86_64-linux
    uses: hoprnet/hopr-workflows/.github/workflows/build-binaries.yaml@45221eb1aadfc5c46751306c5c7d6d291c8a24b3 # build-binaries-v3.1.2
    if: ${{ github.event.pull_request.head.repo.fork == false }}
    permissions:
      contents: read
      id-token: write
    with:
      source_branch: ${{ github.event.pull_request.head.ref || github.ref }}
      version_type: commit
      architecture: x86_64-linux
      cachix_cache_name: gnosis-vpn-client
      build_command: nix build -L .#binary-gnosis_vpn-x86_64-linux
      build_debug_command: nix build -L .#binary-gnosis_vpn-x86_64-linux-dev
      binary: gnosis_vpn-client
      gcp_workload_identity_provider: projects/656686060169/locations/global/workloadIdentityPools/gnosisvpn-gh-pool/providers/github-provider
      gcp_service_account: download-gnosisvpn-gh-sa@gnosisvpn-production.iam.gserviceaccount.com
      runner: depot-ubuntu-22.04-4 # Depot Ubuntu 22.04, 4 CPUs, 16 GB RAM
      timeout_minutes: 240
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      gpg_private_key: ${{ secrets.GNOSISVPN_GPG_PRIVATE_KEY }}
      gpg_private_key_password: ${{ secrets.GNOSISVPN_GPG_PRIVATE_KEY_PASSWORD }}
      apple_certificate: ${{ secrets.APPLE_CERTIFICATE_DEVELOPER_P12_BASE64 }}
      apple_certificate_password: ${{ secrets.APPLE_CERTIFICATE_DEVELOPER_PASSWORD }}
  build-arm-binaries:
    name: Binary ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: aarch64-linux
            runner: depot-ubuntu-22.04-arm-4 # Depot Ubuntu 22.04 ARM, 4 CPUs, 16 GB RAM
            build_command: nix build -L .#binary-gnosis_vpn-aarch64-linux
            build_debug_command: nix build -L .#binary-gnosis_vpn-aarch64-linux-dev
            required_label: "binary:aarch64-linux"
          - architecture: aarch64-darwin
            runner: ${{ vars.MACOS_RUNNER }} # Posible values are: `macos-26-xlarge` or `depot-macos-26`
            build_command: nix build -L .#binary-gnosis_vpn-aarch64-darwin
            build_debug_command: nix build -L .#binary-gnosis_vpn-aarch64-darwin-dev
            required_label: "binary:aarch64-darwin"
    uses: hoprnet/hopr-workflows/.github/workflows/build-binaries.yaml@45221eb1aadfc5c46751306c5c7d6d291c8a24b3 # build-binaries-v3.1.2
    if: ${{ github.event.pull_request.head.repo.fork == false }}
    permissions:
      contents: read
      id-token: write
    with:
      source_branch: ${{ github.event.pull_request.head.ref || github.ref }}
      version_type: commit
      architecture: ${{ matrix.architecture }}
      cachix_cache_name: gnosis-vpn-client
      build_command: ${{ matrix.build_command }}
      build_debug_command: ${{ matrix.build_debug_command }}
      binary: gnosis_vpn-client
      gcp_workload_identity_provider: projects/656686060169/locations/global/workloadIdentityPools/gnosisvpn-gh-pool/providers/github-provider
      gcp_service_account: download-gnosisvpn-gh-sa@gnosisvpn-production.iam.gserviceaccount.com
      runner: ${{ matrix.runner }}
      timeout_minutes: 240
      enabled: ${{ matrix.required_label == '' || contains(github.event.pull_request.labels.*.name, matrix.required_label) }}
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      gpg_private_key: ${{ secrets.GNOSISVPN_GPG_PRIVATE_KEY }}
      gpg_private_key_password: ${{ secrets.GNOSISVPN_GPG_PRIVATE_KEY_PASSWORD }}
      apple_certificate: ${{ secrets.APPLE_CERTIFICATE_DEVELOPER_P12_BASE64 }}
      apple_certificate_password: ${{ secrets.APPLE_CERTIFICATE_DEVELOPER_PASSWORD }}
  checks:
    name: Checks
    if: ${{ github.event.pull_request.head.repo.fork == false }}
    runs-on: depot-ubuntu-22.04-4
    steps:
      - name: Run checks
        uses: hoprnet/hopr-workflows/actions/nix-action@ade4bbd75f7204255c61d19c23f67d3da221e7d2 # nix-action-v1.1.3
        with:
          source_branch: ${{ github.event.pull_request.head.ref || github.ref }}
          cachix_cache_name: gnosis-vpn-client
          cachix_auth_token: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          command: nix flake check -L --show-trace
  system-test:
    name: System tests
    # NOTE: Do not switch to a depot runner here. The system-test recipe requires passwordless
    # sudo (for useradd, chown, etc.). Depot containers restrict these syscalls even for root.
    # Standard GitHub-hosted runners support passwordless sudo for all commands out of the box.
    runs-on: ubuntu-22.04
    if: ${{ github.event.pull_request.head.repo.fork == false }}
    needs:
      - build-x86_64-linux
    permissions:
      contents: read
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - name: Checkout repository
        # Pin to the PR head commit: the default pull_request checkout uses the
        # auto-generated merge ref, which gives `self.rev` a different value than
        # build-x86_64-linux (which checks out the head branch directly). That
        # mismatch changes the derivation hash, causing a cachix miss and a full
        # rebuild here instead of reusing the binary build-x86_64-linux already pushed.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Setup Nix
        uses: hoprnet/hopr-workflows/actions/setup-nix@ade4bbd75f7204255c61d19c23f67d3da221e7d2 # setup-nix-v2.0.2
        with:
          cachix_cache_name: gnosis-vpn-client
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Install just
        uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2
      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats
      - name: Run offline smoke-test suite
        run: just smoke-test-check
      - name: Fetch release binaries
        # Reuses the artifact build-x86_64-linux already built and pushed to
        # cachix, instead of recompiling root/worker/ctl here a second time.
        run: |
          nix build -L .#binary-gnosis_vpn-x86_64-linux -o result-release
      - name: Build system test runner
        run: |
          nix build -L .#binary-gnosis_vpn-system_tests -o result-system-tests
      - name: Run the system test
        env:
          SYSTEM_TEST_HOPRD_ID: ${{ secrets.SYSTEM_TEST_HOPRD_ID }}
          SYSTEM_TEST_HOPRD_ID_PASSWORD: ${{ secrets.SYSTEM_TEST_HOPRD_ID_PASSWORD }}
          SYSTEM_TEST_SAFE: ${{ secrets.SYSTEM_TEST_SAFE }}
          SYSTEM_TEST_CONFIG: ${{ secrets.SYSTEM_TEST_CONFIG}}
          SYSTEM_TEST_WORKER_BINARY: ${{ github.workspace }}/result-release/bin/gnosis_vpn-worker
          SYSTEM_TEST_ROOT_BINARY: ${{ github.workspace }}/result-release/bin/gnosis_vpn-root
          # TODO(hoprd-v5): make branch-conditional once a v5 blokli endpoint exists.
          SYSTEM_TEST_BLOKLI_URL: https://blokli.rotsee.hoprnet.link
        run: just system-tests ${{ github.workspace }}/result-system-tests/bin/gnosis_vpn-system_tests
