name: PR
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
  merge_group:
concurrency:
  group: ${{ github.ref }}-pr
  cancel-in-progress: true
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  # Split out from the arm/darwin matrix below so system-test can depend on
  # just this leg via `needs:` and reuse its cachix-pushed binary instead of
  # recompiling root/worker/ctl itself.
  build-x86_64-linux:
    name: Binary x86_64-linux
    uses: hoprnet/hopr-workflows/.github/workflows/build-binaries.yaml@f15435652c572ad5688af679f0e2b153c98c9773 # build-binaries-v4.0.2
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    with:
      repo_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      version_type: commit
      architecture: x86_64-linux
      cachix_cache_name: gnosis-vpn-client
      build_command: nix build -L .#binary-gnosis_vpn-x86_64-linux
      build_debug_command: nix build -L .#binary-gnosis_vpn-x86_64-linux-dev
      binary: gnosis_vpn-client
      gcp_workload_identity_provider: projects/656686060169/locations/global/workloadIdentityPools/gnosisvpn-gh-pool/providers/github-provider
      gcp_service_account: download-gnosisvpn-gh-sa@gnosisvpn-production.iam.gserviceaccount.com
      runner: depot-ubuntu-22.04-4 # Depot Ubuntu 22.04, 4 CPUs, 16 GB RAM
      timeout_minutes: 240
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      gpg_private_key: ${{ secrets.GNOSISVPN_GPG_PRIVATE_KEY }}
      gpg_private_key_password: ${{ secrets.GNOSISVPN_GPG_PRIVATE_KEY_PASSWORD }}
      apple_certificate: ${{ secrets.APPLE_CERTIFICATE_DEVELOPER_P12_BASE64 }}
      apple_certificate_password: ${{ secrets.APPLE_CERTIFICATE_DEVELOPER_PASSWORD }}
  build-arm-binaries:
    name: Binary ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: aarch64-linux
            runner: depot-ubuntu-22.04-arm-4 # Depot Ubuntu 22.04 ARM, 4 CPUs, 16 GB RAM
            build_command: nix build -L .#binary-gnosis_vpn-aarch64-linux
            build_debug_command: nix build -L .#binary-gnosis_vpn-aarch64-linux-dev
            required_label: "binary:aarch64-linux"
          - architecture: aarch64-darwin
            runner: ${{ vars.MACOS_RUNNER }} # Posible values are: `macos-26-xlarge` or `depot-macos-26`
            build_command: nix build -L .#binary-gnosis_vpn-aarch64-darwin
            build_debug_command: nix build -L .#binary-gnosis_vpn-aarch64-darwin-dev
            required_label: "binary:aarch64-darwin"
    uses: hoprnet/hopr-workflows/.github/workflows/build-binaries.yaml@f15435652c572ad5688af679f0e2b153c98c9773 # build-binaries-v4.0.2
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    with:
      repo_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      version_type: commit
      architecture: ${{ matrix.architecture }}
      cachix_cache_name: gnosis-vpn-client
      build_command: ${{ matrix.build_command }}
      build_debug_command: ${{ matrix.build_debug_command }}
      binary: gnosis_vpn-client
      gcp_workload_identity_provider: projects/656686060169/locations/global/workloadIdentityPools/gnosisvpn-gh-pool/providers/github-provider
      gcp_service_account: download-gnosisvpn-gh-sa@gnosisvpn-production.iam.gserviceaccount.com
      runner: ${{ matrix.runner }}
      timeout_minutes: 240
      enabled: ${{ matrix.required_label == '' || contains(github.event.pull_request.labels.*.name, 'binary:all') || contains(github.event.pull_request.labels.*.name, matrix.required_label) }}
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      gpg_private_key: ${{ secrets.GNOSISVPN_GPG_PRIVATE_KEY }}
      gpg_private_key_password: ${{ secrets.GNOSISVPN_GPG_PRIVATE_KEY_PASSWORD }}
      apple_certificate: ${{ secrets.APPLE_CERTIFICATE_DEVELOPER_P12_BASE64 }}
      apple_certificate_password: ${{ secrets.APPLE_CERTIFICATE_DEVELOPER_PASSWORD }}
  checks:
    name: Checks
    # Already ran on the PR; the queue only exists for the secret-using system test
    if: github.event_name != 'merge_group'
    permissions:
      contents: read
    uses: hoprnet/hopr-workflows/.github/workflows/checks.yaml@061b4579c870b0fdc008f5ff07a3a500e4fede50 # workflow-checks-v2.3.1
    with:
      source_branch: ${{ github.event.pull_request.head.sha || github.sha }}
      cachix_cache_name: gnosis-vpn-client
      conflict_markers: true
      # No `.#check` app or `.#ci` devshell here; `nix flake check` already covers clippy/docs/test/licenses.
      format: false
      pre_commit: false
      deps: false
      lint_command: nix flake check -L --show-trace
      audit_command: nix run -L .#audit
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
  system-test:
    name: System tests
    # NOTE: Do not switch to a depot runner here. The system-test recipe requires passwordless
    # sudo (for useradd, chown, etc.). Depot containers restrict these syscalls even for root.
    # Standard GitHub-hosted runners support passwordless sudo for all commands out of the box.
    runs-on: ubuntu-26.04
    # Runs PR code with a funded node identity: only in the merge queue, after review
    if: github.event_name == 'merge_group'
    needs:
      - build-x86_64-linux
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        # Same commit as build-x86_64-linux, so `self.rev` matches and the cachix-pushed binary is reused
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Nix
        uses: hoprnet/hopr-workflows/actions/setup-nix@ade4bbd75f7204255c61d19c23f67d3da221e7d2 # setup-nix-v2.0.2
        with:
          cachix_cache_name: gnosis-vpn-client
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Fetch release binaries
        # Reuses the artifact build-x86_64-linux already built and pushed to
        # cachix, instead of recompiling root/worker/ctl here a second time.
        run: |
          nix build -L .#binary-gnosis_vpn-x86_64-linux -o result-release
      - name: Build system test runner
        run: |
          nix build -L .#binary-gnosis_vpn-system_tests -o result-system-tests
      - name: Run the system test
        env:
          # Both secret names must exist: a missing one yields '' and falls through to the other network
          SYSTEM_TEST_NETWORK: "${{ startsWith(github.event.merge_group.base_ref, 'refs/heads/release/') && 'jura-dev' || 'piz-palu-dev' }}"
          SYSTEM_TEST_HOPRD_ID: "${{ startsWith(github.event.merge_group.base_ref, 'refs/heads/release/') && secrets.SYSTEM_TEST_HOPRD_ID_JURA_DEV || secrets.SYSTEM_TEST_HOPRD_ID_PIZ_PALU_DEV }}"
          SYSTEM_TEST_HOPRD_ID_PASSWORD: "${{ startsWith(github.event.merge_group.base_ref, 'refs/heads/release/') && secrets.SYSTEM_TEST_HOPRD_ID_PASSWORD_JURA_DEV || secrets.SYSTEM_TEST_HOPRD_ID_PASSWORD_PIZ_PALU_DEV }}"
          SYSTEM_TEST_WORKER_BINARY: ${{ github.workspace }}/result-release/bin/gnosis_vpn-worker
          SYSTEM_TEST_ROOT_BINARY: ${{ github.workspace }}/result-release/bin/gnosis_vpn-root
          SYSTEM_TEST_CTL_BINARY: ${{ github.workspace }}/result-release/bin/gnosis_vpn-ctl
        run: just system-tests ${{ github.workspace }}/result-system-tests/bin/gnosis_vpn-system_tests
  ci-ok:
    name: CI OK
    # Single required status check: stable across matrix expansion, label gating and the queue-only system test.
    if: always() # a skipped job counts as passing, so never let a failed dependency skip this one
    needs: [build-x86_64-linux, build-arm-binaries, checks, system-test]
    runs-on: depot-ubuntu-22.04-4
    permissions: {}
    steps:
      - name: Fail if any CI job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
