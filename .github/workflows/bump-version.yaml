name: Bump version
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Version bump type (ignored when custom_version is set)
        required: true
        type: choice
        default: "patch"
        options:
          - patch
          - minor
          - major
      custom_version:
        description: Explicit version X.Y.Z (overrides release_type)
        required: false
        type: string
concurrency:
  group: bump-version
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  bump-version:
    name: Bump version
    runs-on: depot-ubuntu-22.04-4 # Depot Ubuntu 22.04, 4 CPUs, 16 GB RAM
    permissions:
      contents: read
    steps:
      - name: Require branch ref
        if: github.ref_type != 'branch'
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "Dispatched from ${REF_TYPE} '${REF_NAME}', but this workflow must run from a branch" >&2
          exit 1
      # Fails at token minting if the app installation lacks either permission.
      - name: Generate GitHub App token
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GH_APP_GNOSISVPN_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_GNOSISVPN_BOT_PRIVATE_KEY }}
          owner: gnosis
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          token: ${{ steps.bot-token.outputs.token }}
      - name: Setup Nix
        uses: hoprnet/hopr-workflows/actions/setup-nix@ade4bbd75f7204255c61d19c23f67d3da221e7d2 # setup-nix-v2.0.2
        with:
          cachix_cache_name: gnosis-vpn-client
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Compute new version
        id: version
        shell: bash
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          CUSTOM_VERSION: ${{ inputs.custom_version }}
        run: |
          current_version=$(grep -E '^version[[:space:]]*=' Cargo.toml | head -n1 | awk -F\" '{print $2}')
          if [[ -n "${CUSTOM_VERSION}" ]]; then
            new_version="${CUSTOM_VERSION#v}"
            if ! [[ "${new_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid custom_version '${CUSTOM_VERSION}', expected X.Y.Z" >&2
              exit 1
            fi
          else
            IFS=. read -r major minor patch <<< "${current_version}"
            case "${RELEASE_TYPE}" in
              major) new_version="$((major + 1)).0.0" ;;
              minor) new_version="${major}.$((minor + 1)).0" ;;
              patch) new_version="${major}.${minor}.$((patch + 1))" ;;
              *)
                echo "Unknown release_type '${RELEASE_TYPE}'" >&2
                exit 1
                ;;
            esac
          fi
          if [[ "${new_version}" == "${current_version}" ]]; then
            echo "New version equals current version (${current_version})" >&2
            exit 1
          fi
          echo "Bumping ${current_version} -> ${new_version}"
          echo "current_version=${current_version}" >> "$GITHUB_OUTPUT"
          echo "new_version=${new_version}" >> "$GITHUB_OUTPUT"
      - name: Update Cargo.toml and Cargo.lock
        shell: bash
        env:
          CURRENT_VERSION: ${{ steps.version.outputs.current_version }}
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          sed -i -E "s/^(version[[:space:]]*=[[:space:]]*)\"${CURRENT_VERSION}\"/\1\"${NEW_VERSION}\"/" Cargo.toml
          if ! grep -qE "^version[[:space:]]*=[[:space:]]*\"${NEW_VERSION}\"" Cargo.toml; then
            echo "Cargo.toml still lacks version ${NEW_VERSION} after the substitution" >&2
            exit 1
          fi
          nix develop --command cargo update --workspace
          git diff --stat -- Cargo.toml Cargo.lock
      # The dispatching branch may be protected (main's ruleset requires a
      # pull request with one approving review), so the bump cannot be pushed
      # to it directly. Land the commit on an unprotected side branch and
      # raise a PR back into the dispatching branch. The side branch embeds
      # the base ref so runs from different bases that compute the same
      # version cannot force-push over each other's PR branch.
      - name: Commit and push version bump
        id: push
        shell: bash
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
          APP_SLUG: ${{ steps.bot-token.outputs.app-slug }}
          BASE: ${{ github.ref_name }}
        run: |
          branch="bump/${BASE}/v${NEW_VERSION}"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          git switch -c "${branch}"
          git add Cargo.toml Cargo.lock
          git commit -m "chore(version): v${NEW_VERSION}"
          # Force so a retry after a failed run reuses the same branch and
          # updates any PR already open from it.
          git push --force origin "HEAD:refs/heads/${branch}"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
      - name: Open pull request
        shell: bash
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          BASE: ${{ github.ref_name }}
          BRANCH: ${{ steps.push.outputs.branch }}
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          # Reuse an open PR from a previous run of the same bump; a closed one
          # must not be picked up, hence pr list --state open over pr view.
          pr_url=$(gh pr list --head "${BRANCH}" --base "${BASE}" --state open --json url --jq '.[0].url // empty')
          if [[ -z "${pr_url}" ]]; then
            pr_url=$(gh pr create \
              --base "${BASE}" \
              --head "${BRANCH}" \
              --title "chore(version): v${NEW_VERSION}" \
              --body "Automated bump to v${NEW_VERSION} from the Bump version workflow.")
          else
            echo "Reusing existing pull request ${pr_url}"
          fi

          {
            echo "### Version bump v${NEW_VERSION}"
            echo
            echo "Pull request: ${pr_url}"
            echo
            echo "Requires one approving review and resolved review threads, then squash-merge."
          } >> "$GITHUB_STEP_SUMMARY"
