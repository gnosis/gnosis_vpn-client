# Cargo audit configuration for gnosis_vpn-client
#
# Vulnerabilities are exempted here because they are either:
# - From transitive dependencies we cannot control
# - Unmaintained crates with no viable alternatives
# - Lack a fixed version

[advisories]
# Advisory IDs to ignore
ignore = [
  "RUSTSEC-2024-0388", # derivative: unmaintained - transitive from alloy ecosystem
  "RUSTSEC-2024-0436", # paste: unmaintained - transitive from alloy-sol-macro
  # hickory-proto advisories: transitive via libp2p 0.56.0 → libp2p-mdns/libp2p-dns → hickory-*;
  # blocked on libp2p upgrading hickory-dns to >=0.26.1
  "RUSTSEC-2026-0118", # hickory-proto: NSEC3 unbounded loop - no fixed version available yet
  "RUSTSEC-2026-0119", # hickory-proto: O(n²) name compression CPU exhaustion - fixed in hickory-proto >=0.26.1
  "RUSTSEC-2026-0387", # crypto-bigint 0.5.5: constant-time leaks - via alloy → k256 0.13, upstream-blocked (GNO-1057, hoprnet/contracts#162)
  "RUSTSEC-2026-0487", # hickory-proto: panic on malformed SVCB/HTTPS alpn - fixed in hickory-proto >=0.26.2
  "RUSTSEC-2026-0489", # hickory-proto: panic on single-quote SVCB/HTTPS value - fixed in hickory-proto >=0.26.2
  "RUSTSEC-2026-0490", # hickory-proto: zone file lexer panic on long token - fixed in hickory-proto >=0.26.2
  "RUSTSEC-2026-0491", # hickory-proto: memory amplification from header record counts - fixed in hickory-proto >=0.26.2
  "RUSTSEC-2026-0504", # hickory-proto: inverted NSEC3 comparison in DNSSEC validation - no fixed version available yet
  "RUSTSEC-2026-0505", # hickory-proto: NSEC3 owner names not checked against the zone - no fixed version available yet
  "RUSTSEC-2026-0511", # hickory-proto: NXDOMAIN accepted for a proven empty non-terminal - no fixed version available yet
  "RUSTSEC-2026-0512", # hickory-proto: DNSSEC accepted an unrelated signed RRset - no fixed version available yet
  "RUSTSEC-2026-0514", # hickory-resolver: lookup returned records that failed DNSSEC validation - no fixed version available yet
  "RUSTSEC-2026-0530", # hickory-proto: parent-side NSEC at a zone cut accepted as nonexistence proof - no fixed version available yet
  "RUSTSEC-2026-0531", # hickory-proto: child-side NSEC/NSEC3 accepted as no-DS proof - no fixed version available yet
  "RUSTSEC-2026-0532", # hickory-proto: parent-side NSEC3 at a zone cut accepted as nonexistence proof - no fixed version available yet
]

# Output configuration
[output]
deny      = []
quiet     = false
show_tree = true
