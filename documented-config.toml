###
# Gnosis VPN service configuration file
#
# On Unix the default config path is `/etc/gnosisvpn/config.toml`
# However, you can override this by using the `GNOSISVPN_CONFIG_PATH` environment variable.
###

# general config file version
version = 6

###
## destinations section - configure available target destinations

[destinations]

# identifier for a destination and its routing options
# [destinations.<id>]
# exit node address (where the connection should terminate)
# address = "<exit node address>"
# additional information about this exit node
# meta = { location = <location> }
# session path: number of intermediate hops (0–3)
# path = { hops = 1 }

[destinations.Germany]
address = "0xD9c11f07BfBC1914877d7395459223aFF9Dc2739"
meta    = { location = "Germany" }
path    = { hops = 1 }

[destinations.USA]
address = "0xa5Ca174Ef94403d6162a969341a61baeA48F57F8"
meta    = { location = "USA" }
path    = { hops = 1 }

[destinations.Spain]
address = "0x8a6E6200C9dE8d8F8D9b4c08F86500a2E3Fbf254"
meta    = { location = "Spain" }
path    = { hops = 1 }

###
## connection section - adjust for more fine grained connection control

# [connection]
# http_timeout - specify general HTTP timeouts for internal protocol related requests
# http_timeout = "60s"

# lan_lockdown - when true, the killswitch blocks all local network traffic (192.168.x.x,
# 10.x.x.x, 172.16.x.x, etc.) while the VPN is active. Defaults to false, which lets
# you reach devices on your local network (printers, NAS, etc.) while still routing all
# internet traffic through the VPN.
# lan_lockdown = false

# probe_local_addresses - when true, allows probing/trusting announced peer addresses
# that are private/local IPs (loopback, 192.168.x.x, 10.x.x.x, etc.) instead of filtering
# them out. Defaults to false. Enable for test/dev clusters whose nodes announce local
# addresses; leave false in production, where such announcements are almost certainly
# misconfigured or spoofed.
# probe_local_addresses = false

# path_planner_min_ack_rate - minimum acknowledgement rate [0.0, 1.0] a path must
# sustain to be considered by the latency path planner. Paths below this threshold are
# skipped. Lower values accept noisier paths; higher values are more selective.
# path_planner_min_ack_rate = 0.1

# determine specific connection parameters for ephemeral bridge connection
# [connection.bridge]
# capabilities = [ "segmentation", "retransmission", "retransmission_ack_only", "no_rate_control" ]
# target = "172.30.0.1:8000"

# determine specific connection parameters for persistent main connection
# [connection.wg]
# capabilities = [ "segmentation", "no_delay" ]
# target = "172.30.0.1:51820"

# adjust internal session validation ping settings
# [connection.ping]
# address = "10.128.0.1"
# timeout = "15s"
# ttl = 6
# seq_count = 3

# adjust health check intervals
# ping runs every cycle, health and version piggyback every Nth cycle
# [connection.health_check_intervals]
# ping = "15s"
# health_every_n_pings = 4  # minimum 1
# version_every_n_pings = 20  # minimum 1
# ICMP ping probe interval when connected (verifies tunnel is working)
# tunnel_ping = "10s"
# consecutive tunnel ping failures before triggering reconnect
# tunnel_ping_max_failures = 3

# adjust SURB balancing per session type
# each section enables balancing for that session; omit to use the defaults below
# bridge and health_check default to disabled; ping and main default to enabled
#
# [connection.surb_balancing.bridge]
# enabled = false
# buffer = "16 KB"
# max_surb_upstream = "128 Kb/s"
# always_max_out_surbs = false  # defaults to `enabled` - send only 1 SURB per request even if 2 would fit
#
# [connection.surb_balancing.ping]
# enabled = true
# buffer = "1 MB"
# max_surb_upstream = "512 Kb/s"
# always_max_out_surbs = true  # defaults to `enabled` - send 2 SURBs per request if 2 would fit
#
# [connection.surb_balancing.main]
# enabled = true
# buffer = "10 MB"
# max_surb_upstream = "16 Mb/s"
# always_max_out_surbs = true  # defaults to `enabled` - send 2 SURBs per request if 2 would fit
#
# [connection.surb_balancing.health_check]
# enabled = false
# buffer = "16 KB"
# max_surb_upstream = "128 Kb/s"
# always_max_out_surbs = false  # defaults to `enabled` - send only 1 SURB per request even if 2 would fit

# adjust PIX enablement per session type
# bridge and health_check default to disabled; ping_main defaults to enabled
# ping_main covers the shared ping/main tunnel session - ping and main are the same
# physical session, so PIX can only be decided once, at session-open time
#
# [connection.pix.bridge]
# enabled = false
#
# [connection.pix.ping_main]
# enabled = true
#
# [connection.pix.health_check]
# enabled = false

###
## wireguard section - specific VPN-related settings

# [wireguard]
# source-address filter for packets arriving from the VPN exit (ingress only);
# egress is always full-tunnel via the OS routes regardless of this value, so a
# range narrower than the default 0.0.0.0/0 drops the exit's return traffic.
# defaults to 0.0.0.0/0 (accept all)
# allowed_ips = "0.0.0.0/0"
# If you want to disable WireGuard key rotation, provide a static private key here.
# force_private_key = "<your WireGuard private key>"
# overwrite default DNS servers for the WireGuard interface; defaults to Cloudflare and Google DNS
# if overwrite false, does not touch DNS settings at all
# dns = { overwrite = true, servers = "1.1.1.1,8.8.8.8" }

###
## chain provider section - query blockchain settings

# see https://github.com/hoprnet/hoprnet/blob/6525d753fde70b5026d19d7a647b8143352b26df/chain/connector/src/connector/mod.rs#L46 for documentation
# [blokli]
# connection_sync_timeout = "30s"
# sync_tolerance = 50
# bound on a single request to blokli, covering DNS, TCP, TLS, request and response;
# raise it on high-latency links where requests time out during startup
# (distinct from connection_sync_timeout, which bounds the whole initial sync, and from
# connection.http_timeout, which applies to exit node requests)
# request_timeout = "10s"

###
## strategy section - channel lifecycle and funding parameters

# [strategy]
# minimum number of open outgoing channels to maintain
# min_open_channels = 5
# target number of open outgoing channels
# target_open_channels = 8
# channel allowlist: when enabled, restricts channel opening to the listed peers only.
# When disabled (default), peers are selected by quality score.
# [strategy.channel_allowlist]
# enabled = false
# peers = ["0x...", "0x..."]

# data volume a single channel should carry before it needs a top-up; default: 1 GiB
# channel_capacity = "1 GiB"
# data volume added to a channel's stake on top-up; default: 1 GiB
# topup_capacity = "1 GiB"
# channel balance (as data capacity) below which a top-up fires; default: 256 MiB
# lower_capacity_threshold = "256 MiB"
# minimum safe balance before opening/funding any channel; default: max(2 x channel_capacity, 1 GiB) = 2 GiB
# min_safe_capacity_required = "2 GiB"
# how capacity converts to a wxHOPR stake: "deterministic" or { probabilistic = { success_probability = 0.999 } };
# default: { probabilistic = { success_probability = 0.99 } }
# sizing_mode = { probabilistic = { success_probability = 0.99 } }

###
## pix section - exit-incentivization payment strategy (pays the Exit per byte)
##
## Tunes the parameters of the global PIX settlement reactor, shared by every session that has
## PIX enabled (see connection.pix above for per-session-type enablement). Deposits are paid
## from the node's own address, not the Safe, so the node needs its own wxHOPR float.

# [pix]
# wxHOPR charged per byte of the agreed per-SSA quota; default: 1 wxHOPR
# price_per_byte = "1 wxHOPR"
# ceiling on a single SSA deposit, refused outright if exceeded; default: 100 wxHOPR
# max_ssa_allocation = "100 wxHOPR"
# debounce window before a batch of pending deposits is flushed; default: 500ms
# deposit_buffer_period = "500ms"
# how long to poll a stealth address for a deposit to land; default: 60s
# max_deposit_tracking_time = "60s"
# additional deposit-transfer attempts beyond the first; default: 3
# max_deposit_retries = 3
