###
# Gnosis VPN service configuration file
#
# On Unix the default config path is `/etc/gnosisvpn/config.toml`
# However, you can override this by using the `GNOSISVPN_CONFIG_PATH` environment variable.
###

# general config file version
version = 7

###
## destinations section - configure available target destinations
#
# This whole section is optional as of version 7: gnosis_vpn-lib can discover exit nodes
# registered on-chain instead, so a config with no [destinations] at all is valid. Configuring a
# destination here still works exactly as before, and is the right place to pin a specific,
# trusted exit node.

[destinations]

# A destination is its exit node and its path. Every value below except those two is optional and
# overrides what the exit node itself publishes, so an entry may be nothing but an address plus the
# values you want to override. Per value: what you set here wins, else what the exit publishes,
# else the global default.
#
# `gvpn-ctl status` tags every destination with where it came from - [c] from this file only, [d]
# discovered on-chain only, [c+d] configured here and discovered too. On a [c+d] entry it also
# marks (c) each value you set here, whether or not the exit publishes a different one.
#
# the handle you connect by: `gvpn-ctl status` shows it and `gvpn-ctl connect` accepts it. An exit
# discovered on-chain gets one made from the `name` it publishes, or its address when it publishes
# none; a handle you set here always wins over a published name. `gvpn-ctl connect` also takes a
# bare exit address, as long as you have not configured that exit at more than one path.
# [destinations.<id>]
# exit node address (where the connection should terminate)
# address = "<exit node address>"
# additional information about this exit node - any key is kept, and overrides the exit's own label
# of the same name. `name`, location, flag and description are shown as labels in `gvpn-ctl status`;
# `name` is left out when the id above already says the same thing
# meta = { name = <title>, location = <location>, flag = <two-letter country code>, description = <free text> }
# session path: number of intermediate hops (0–3). Not an override: a discovered exit is always
# reachable at 1 hop, so an entry at another path is an additional destination beside it. Two
# entries for the same exit at the same path are rejected.
# path = { hops = 1 }
# override the exit node's own gvpn-server/WireGuard endpoints for this destination. Optional —
# omit to use whatever the exit node publishes, falling back to the global
# [connection.bridge]/[connection.wg] targets below when it is not discovered at all.
# gnosis_vpn_server = "172.30.0.1:8000"
# wireguard_server = "172.30.0.1:51820"

[destinations.Germany]
address = "0xD9c11f07BfBC1914877d7395459223aFF9Dc2739"
meta    = { location = "Germany" }
path    = { hops = 1 }

[destinations.USA]
address = "0xa5Ca174Ef94403d6162a969341a61baeA48F57F8"
meta    = { location = "USA" }
path    = { hops = 1 }

[destinations.Spain]
address = "0x8a6E6200C9dE8d8F8D9b4c08F86500a2E3Fbf254"
meta    = { location = "Spain" }
path    = { hops = 1 }

###
## connection section - adjust for more fine grained connection control

# [connection]
# http_timeout - specify general HTTP timeouts for internal protocol related requests
# http_timeout = "60s"

# lan_lockdown - when true, the killswitch blocks all local network traffic (192.168.x.x,
# 10.x.x.x, 172.16.x.x, etc.) while the VPN is active. Defaults to false, which lets
# you reach devices on your local network (printers, NAS, etc.) while still routing all
# internet traffic through the VPN.
# lan_lockdown = false

# probe_local_addresses - when true, allows probing/trusting announced peer addresses
# that are private/local IPs (loopback, 192.168.x.x, 10.x.x.x, etc.) instead of filtering
# them out. Defaults to false. Enable for test/dev clusters whose nodes announce local
# addresses; leave false in production, where such announcements are almost certainly
# misconfigured or spoofed.
# probe_local_addresses = false

# path_planner_min_ack_rate - minimum acknowledgement rate [0.0, 1.0] a path must
# sustain to be considered by the latency path planner. Paths below this threshold are
# skipped. Lower values accept noisier paths; higher values are more selective.
# path_planner_min_ack_rate = 0.1

# [connection.path_planner] - fine-grained overrides for the HOPR path planner.
# Every key is optional; an unset key keeps the value shown below. min_ack_rate is
# configured via path_planner_min_ack_rate above and is not repeated here.
# [connection.path_planner]
# max_cache_capacity - maximum number of (source, destination, hops) entries cached.
# max_cache_capacity = 10000
# cache_ttl - how long a cached path list, and the weights computed with it, stay
# valid before the next lookup recomputes them (humantime string).
# cache_ttl = "10s"
# refresh_period - period between proactive background cache-refresh sweeps (humantime).
# refresh_period = "5s"
# max_cached_paths - maximum candidate paths the selector returns per query.
# max_cached_paths = 50
# edge_penalty - multiplier [0.0, 1.0] down-weighting edges without probe observations.
# edge_penalty = 0.5
# min_paths_anonymity_floor - keep at most this many candidate paths, dropping the
# slowest first and preferring distinct first relayers; 0 keeps every path. Fewer
# paths means less relayer diversity, which weakens detection of a dead return path.
# The client preset uses 0; the installer-shipped configs set 3.
# min_paths_anonymity_floor = 0
# latency_halflife - path latency at which the latency weight factor equals 0.5;
# larger values make selection less latency-sensitive (humantime).
# latency_halflife = "100ms"
# capacity_reference - channel capacity, counted in single-hop tickets, at which the
# capacity factor saturates; a path counts as its thinnest channel.
# capacity_reference = 10000000
# return_path_weight_temper - exponent (0.0, 1.0] flattening the return-path sampling
# distribution; 1.0 samples by raw path value, smaller values tend toward uniform.
# return_path_weight_temper = 0.5
# return_path_exploration - fraction [0.0, 1.0] of return-path draws made uniformly at
# random to keep every candidate under observation; 0.0 disables exploration.
# return_path_exploration = 0.1
# max_plausible_loopback_rtt - upper bound on a plausible loopback probe RTT; larger
# measurements are discarded instead of poisoning the latency estimate (humantime).
# max_plausible_loopback_rtt = "30s"

# determine specific connection parameters for ephemeral bridge connection
# [connection.bridge]
# capabilities = [ "segmentation", "retransmission", "retransmission_ack_only", "no_rate_control" ]
# target = "172.30.0.1:8000"

# determine specific connection parameters for persistent main connection
# [connection.wg]
# capabilities = [ "segmentation", "no_delay" ]
# target = "172.30.0.1:51820"

# adjust internal session validation ping settings
# [connection.ping]
# address = "10.128.0.1"
# timeout = "15s"
# ttl = 6
# seq_count = 3

# adjust the cadence of the checks running on the probe session (`gnosis_vpn-ctl probe <id>`)
# [connection.health_check_intervals]
# version = "1h"  # exit API version check
# ping = "10s"    # exit ping for latency
# load = "15s"    # exit load (slots, load average)
# ICMP ping probe interval when connected (verifies tunnel is working)
# tunnel_ping = "10s"
# consecutive tunnel ping failures before triggering reconnect
# tunnel_ping_max_failures = 3

# adjust SURB balancing per session type
# each section enables balancing for that session; omit to use the defaults below
# bridge defaults to disabled; ping and main default to enabled
# the probe session is the bridge session, so it follows the bridge settings
#
# [connection.surb_balancing.bridge]
# enabled = false
# buffer = "16 KB"
# max_surb_upstream = "128 Kb/s"
# always_max_out_surbs = false  # defaults to `enabled` - send only 1 SURB per request even if 2 would fit
#
# [connection.surb_balancing.ping]
# enabled = true
# buffer = "1 MB"
# max_surb_upstream = "512 Kb/s"
# always_max_out_surbs = true  # defaults to `enabled` - send 2 SURBs per request if 2 would fit
#
# [connection.surb_balancing.main]
# enabled = true
# buffer = "10 MB"
# max_surb_upstream = "16 Mb/s"
# always_max_out_surbs = true  # defaults to `enabled` - send 2 SURBs per request if 2 would fit
#
# [connection.surb_balancing.ramp] - after connecting, the SURB balancer is moved
# from the ping tier to the main tier gradually instead of jumping (a jump floods
# the response buffer). interval is how often the setpoint is nudged, duration is
# how long the full ramp takes (both humantime strings, both must be > 0).
# [connection.surb_balancing.ramp]
# interval = "1s"
# duration = "20s"

# adjust PIX enablement per session type
# bridge defaults to disabled; ping_main defaults to enabled
# ping_main covers the shared ping/main tunnel session - ping and main are the same
# physical session, so PIX can only be decided once, at session-open time
#
# [connection.pix.bridge]
# enabled = false
#
# [connection.pix.ping_main]
# enabled = true

# Entry-side PIX share-generator overrides; leave unset unless matching an Exit's advertised quota window.
# Quota is num_ssa_parts x (ssa_part_size + additional_shares) x 1038 bytes; defaults are ~649 MiB.
# The Exit must accept these exactly; `hoprd-localcluster --enable-pix` uses 8 x (2 + 2).
# num_ssa_parts: 8..=16192, ssa_part_size: 2..=255, additional_shares: 0..=255 and <= ssa_part_size.
# [connection.pix.dimensions]
# num_ssa_parts = 8192
# ssa_part_size = 64
# additional_shares = 16

###
## wireguard section - specific VPN-related settings

# [wireguard]
# source-address filter for packets arriving from the VPN exit (ingress only);
# egress is always full-tunnel via the OS routes regardless of this value, so a
# range narrower than the default 0.0.0.0/0 drops the exit's return traffic.
# defaults to 0.0.0.0/0 (accept all)
# allowed_ips = "0.0.0.0/0"
# If you want to disable WireGuard key rotation, provide a static private key here.
# force_private_key = "<your WireGuard private key>"
# overwrite default DNS servers for the WireGuard interface; defaults to Cloudflare and Google DNS
# if overwrite false, does not touch DNS settings at all
# dns = { overwrite = true, servers = "1.1.1.1,8.8.8.8" }

###
## chain provider section - query blockchain settings

# see https://github.com/hoprnet/hoprnet/blob/6525d753fde70b5026d19d7a647b8143352b26df/chain/connector/src/connector/mod.rs#L46 for documentation
# [blokli]
# connection_sync_timeout = "30s"
# sync_tolerance = 50
# bound on a single request to blokli, covering DNS, TCP, TLS, request and response;
# raise it on high-latency links where requests time out during startup
# (distinct from connection_sync_timeout, which bounds the whole initial sync, and from
# connection.http_timeout, which applies to exit node requests)
# request_timeout = "10s"

###
## strategy section - channel lifecycle and funding parameters

# [strategy]
# minimum number of open outgoing channels to maintain
# min_open_channels = 5
# target number of open outgoing channels
# target_open_channels = 8
# channel allowlist: when enabled, restricts channel opening to the listed peers only.
# When disabled (default), peers are selected by quality score.
# [strategy.channel_allowlist]
# enabled = false
# peers = ["0x...", "0x..."]

# data volume a single channel should carry before it needs a top-up; default: 1 GiB
# channel_capacity = "1 GiB"
# data volume added to a channel's stake on top-up; default: 1 GiB
# topup_capacity = "1 GiB"
# channel balance (as data capacity) below which a top-up fires; default: 256 MiB
# lower_capacity_threshold = "256 MiB"
# how capacity converts to a wxHOPR stake: "deterministic" or { probabilistic = { success_probability = 0.999 } };
# default: { probabilistic = { success_probability = 0.99 } }
# sizing_mode = { probabilistic = { success_probability = 0.99 } }

###
## pix_strategy section - exit-incentivization payment strategy (pays the Exit per byte)
##
## Tunes the parameters of the global PIX settlement reactor, shared by every session that has
## PIX enabled (see connection.pix above for per-session-type enablement). Deposits are paid
## from the Safe (via execTransactionFromModule), same account the channel-lifecycle strategy
## stakes channels from -- see min_safe_hopr_reserve below to keep PIX from spending that budget.

# [pix_strategy]
# wxHOPR charged per byte of the agreed per-SSA quota; default: 1 wxHOPR
# price_per_byte = "1 wxHOPR"
# ceiling on a single SSA deposit, refused outright if exceeded; default: 100 wxHOPR
# max_ssa_allocation = "100 wxHOPR"
# aggregate wxHOPR committed to deposits within spend_window, 0 disables the limit; default: 10000 wxHOPR
# max_spend_per_window = "10000 wxHOPR"
# rolling window max_spend_per_window is measured over; default: 1h
# spend_window = "1h"
# debounce window before a batch of pending deposits is flushed; default: 500ms
# deposit_buffer_period = "500ms"
# how long to poll a stealth address for a deposit to land; default: 60s
# max_deposit_tracking_time = "60s"
# additional deposit-transfer attempts beyond the first; default: 3
# max_deposit_retries = 3
# wxHOPR the Safe must still hold after a deposit, refused if a deposit would breach it; default: 0
# min_safe_hopr_reserve = "0 wxHOPR"
